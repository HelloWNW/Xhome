# Force a sane capture period size for the I2S mic.
#
# The default 32-frame period at 48 kHz fires a DMA interrupt every 0.67 ms
# (~1500/sec), saturating the Pi Zero's single core and causing capture
# overruns (audible as choppy / dropped audio). 1024 frames drops that to
# ~47/sec while adding only ~21 ms of latency.

pcm.micdsnoop {
    type dsnoop
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        channels 2
        rate 48000
        format S32_LE
        period_size 1024
        buffer_size 32768
    }
}

# plug wrapper: handles the stereo->mono downmix for ffmpeg.
# Rate stays at the hardware-native 48 kHz so no resampling occurs.
pcm.miccap {
    type plug
    slave.pcm "micdsnoop"
}
